name: Deploy API
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "infra/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements-dev.txt
      - run: pytest api
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: "AWS Access Credentials"
    env:
      # bin/infra.ts constructs every stack (including IngestionStack) unconditionally,
      # even though only ApiStack is targeted below — IngestionStack's constructor guards
      # on RIOT_API_KEY being set, so this placeholder just satisfies that check.
      # IngestionStack itself is never deployed by this workflow.
      RIOT_API_KEY: "unused-placeholder-cdk-deploy-apistack-only"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: npx cdk deploy ApiStack --require-approval never
